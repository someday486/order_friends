name: CI

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Backend Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Generate coverage report
        run: npm run test:cov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/coverage-final.json
          fail_ci_if_error: false

  web:
    name: Web Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix apps/web

      - name: Run web linter
        run: npm run lint --prefix apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:4000

      - name: Run web build
        run: npm run build --prefix apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:4000

      - name: Install Playwright browsers
        run: npm exec --prefix apps/web playwright install --with-deps chromium

      - name: Run web E2E tests
        run: npm run test:e2e --prefix apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:4000
          NEXT_PUBLIC_E2E_BYPASS_AUTH: true

  build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm ci --prefix apps/web

      - name: Run backend security audit
        run: npm audit --omit=dev --json > audit-report-backend.json || true

      - name: Run web security audit
        run: npm audit --omit=dev --prefix apps/web --json > audit-report-web.json || true

      - name: Check for critical vulnerabilities
        run: |
          BACKEND_HIGH=$(grep -o '"high":[0-9]*' audit-report-backend.json | head -1 | cut -d':' -f2 || echo "0")
          BACKEND_CRITICAL=$(grep -o '"critical":[0-9]*' audit-report-backend.json | head -1 | cut -d':' -f2 || echo "0")
          WEB_HIGH=$(grep -o '"high":[0-9]*' audit-report-web.json | head -1 | cut -d':' -f2 || echo "0")
          WEB_CRITICAL=$(grep -o '"critical":[0-9]*' audit-report-web.json | head -1 | cut -d':' -f2 || echo "0")
          echo "Backend high=$BACKEND_HIGH critical=$BACKEND_CRITICAL"
          echo "Web high=$WEB_HIGH critical=$WEB_CRITICAL"
          if [ "$BACKEND_CRITICAL" -gt "0" ] || [ "$WEB_CRITICAL" -gt "0" ]; then
            echo "Critical vulnerabilities found."
            exit 1
          fi

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: security-audit
          path: |
            audit-report-backend.json
            audit-report-web.json
          retention-days: 30

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build, security, web]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (Optional)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: orderfriends/api
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test, build, security, web, docker]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging-api.orderfriends.app
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist/

      - name: Trigger staging deploy webhook
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.STAGING_DEPLOY_WEBHOOK_URL }}
          IMAGE_TAGS: ${{ needs.docker.outputs.tags }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "STAGING_DEPLOY_WEBHOOK_URL not configured; skipping deployment trigger."
            exit 0
          fi
          curl -fsSL -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"imageTags\":\"$IMAGE_TAGS\",\"sha\":\"${{ github.sha }}\"}"

      - name: Run staging health check
        env:
          HEALTHCHECK_URL: ${{ secrets.STAGING_HEALTHCHECK_URL }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "STAGING_HEALTHCHECK_URL not configured; skipping health check."
            exit 0
          fi
          sleep 15
          curl -fsSL "$HEALTHCHECK_URL"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, build, security, web, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://api.orderfriends.app
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist/

      - name: Trigger production deploy webhook
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.PRODUCTION_DEPLOY_WEBHOOK_URL }}
          IMAGE_TAGS: ${{ needs.docker.outputs.tags }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "PRODUCTION_DEPLOY_WEBHOOK_URL not configured; skipping deployment trigger."
            exit 0
          fi
          curl -fsSL -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"imageTags\":\"$IMAGE_TAGS\",\"sha\":\"${{ github.sha }}\"}"

      - name: Run production health check
        env:
          HEALTHCHECK_URL: ${{ secrets.PRODUCTION_HEALTHCHECK_URL }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "PRODUCTION_HEALTHCHECK_URL not configured; skipping health check."
            exit 0
          fi
          sleep 15
          curl -fsSL "$HEALTHCHECK_URL"
